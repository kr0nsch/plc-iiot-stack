    STOPICPREFIX | UIMAXPERCYCLE | UDIPUBLISHED | UDIFAILED | UDIDROPPED | UDIEVENTS | UIPENDING | FBJSON |
    STOPIC | DICURSOR | STALARM | AALARMTABLE
)$'''
