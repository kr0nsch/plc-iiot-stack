[[allow]]
id = "UnusedVariable"
file = "src/POUs/Iiot/FB_MqttClientNone/*.method.decl.st"
reason = "Клиент без транспорта (нулевой объект I_MqttClient): сигнатуры методов заданы интерфейсом, параметры намеренно не используются — методы возвращают отказ «нет соединения»"

# --- UnusedVariable: ложные срабатывания iec_checker 0.4 (обращение есть) ---
# iec_checker 0.4 не считает использованием: обращения из методов ФБ (сборка выносит методы в отдельные
# функции, в теле ФБ обращения нет), вызов экземпляра ФБ и его методов (fbX(...), fbX.M()), обращения к
# полям (stX.y, fbX.y, a[i].y) и переменные в границах FOR (FOR i := 1 TO MAX(uiN, 1)).

[[allow]]
