# Места, где iec_checker 0.4 не разбирает допустимый в CODESYS ST текст, — для
# tools_project/iec_checker_gate.py. run_iec_checker.py шаблона ParserError не обосновывает; обёртка
# принимает ParserError, LexingError и UnknownError разборщика только здесь. Разбор —
# docs/STATIC_ANALYSIS.md, раздел «iec_checker: пробелы разборщика».
#
# Ключи записи [[gap]]:
#   file   — путь исходника от корня (точно);
#   match  — регулярное выражение по тексту строки исходника, на которой разборщик остановился;
#   reason — какую конструкцию не понимает разборщик и почему её нельзя заменить.
# Запись, которой больше не соответствует ни одна находка, — ошибка: список держится актуальным.
# После ошибки разбора iec_checker файл дальше не анализирует — поэтому конструкции вынесены в
# отдельные маленькие объекты; их проверяют компилятор CODESYS, тесты coUnit и st_lint.

[[gap]]
file = "src/POUs/Iiot/F_IiotNow/F_IiotNow.impl.st"
match = '\bLTIME\(\)'
reason = "Оператор CODESYS LTIME() (монотонное время с запуска) — источник времени без сторонних библиотек; в грамматике iec_checker 0.4 его нет. LTIME() вызывается только в F_IiotNow, остальной код получает время её вызовом"

[[gap]]
file = "tests/POUs/FB_JsonBuilder_Test/IntExtremes.method.impl.st"
match = 'LINT#9223372036854775807'
reason = "Граница диапазона LINT (2^63 - 1) в тесте сериализации: iec_checker 0.4 читает целые литералы в 63-битное целое OCaml (Failure int_of_string). Проверять границу без литерала нельзя; затронут только этот тест-метод"
