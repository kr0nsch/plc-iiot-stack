# Слушатель MQTT поверх TLS. Добавляется к mosquitto.conf, когда MQTT_TLS=true
# (make up TLS=1 или docker compose -f docker-compose.yml -f docker-compose.tls.yml up).
# Сертификаты: make certs (tools_project/gen_mqtt_certs.sh) → mosquitto/certs/; entrypoint копирует
# их в /mosquitto/run/certs с владельцем mosquitto.
listener 8883
protocol mqtt
cafile /mosquitto/run/certs/ca.crt
certfile /mosquitto/run/certs/server.crt
keyfile /mosquitto/run/certs/server.key
# Минимальная версия — TLS 1.2 (принимаются 1.2 и 1.3) явно, а не по умолчанию сборки Mosquitto и OpenSSL
tls_version tlsv1.2

# Клиент входит по логину и паролю; сертификат клиента не требуется. Для взаимной аутентификации
# (mTLS) — require_certificate true и клиентский сертификат от того же УЦ (gen_mqtt_certs.sh --client).
require_certificate false
