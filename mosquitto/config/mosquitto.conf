# Mosquitto 2.0 стенда КНС-1. Контейнер запускается через mosquitto/docker-entrypoint.sh: он
# собирает в /mosquitto/run/ файл паролей и ACL из .env и итоговый конфиг (с TLS-слушателем из
# tls.conf, если MQTT_TLS=true). Права пользователей — docs/data_schema.md, раздел 2.3.

# Логин и ACL общие для всех слушателей (1883 и 8883)
per_listener_settings false
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/run/acl

# Постоянные сессии (Telegraf, QoS 1) и сохранённые (retain) сообщения переживают перезапуск
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Очередь на клиента постоянной сессии: при ~120 метриках с контрольным периодом 60 с хватает
# на несколько часов простоя Telegraf
max_queued_messages 20000
max_inflight_messages 100
max_packet_size 65536
max_keepalive 300

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

# Темы $SYS (по ним проверяется здоровье брокера)
sys_interval 10

# MQTT без шифрования: сеть docker стенда; на хост — только 127.0.0.1 (MQTT_BIND в .env).
# ПЛК в сети предприятия подключается к TLS-слушателю 8883 (docker-compose.tls.yml).
listener 1883
protocol mqtt
