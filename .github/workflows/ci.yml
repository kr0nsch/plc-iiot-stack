# CI стенда IIoT КНС-1.
#   checks      — проверки шаблона ПЛК без CODESYS: ruff, mypy, pytest (схемы, конфигурация стенда),
#                 сборка ST, st_lint, iec_checker;
#   packages    — эмулятор ПЛК (emulator/) и суточный отчёт (report/): mypy и юнит-тесты;
#   stack       — docker compose на Linux: make demo с нуля (эмулятор, данные на дашбордах за 5 минут),
#                 интеграционные тесты «эмулятор → брокер → InfluxDB → запрос», проверка панелей
#                 дашбордов, отчёт по данным стенда;
#   iec_checker_nightly, rusty — необязательные сверки ST.
# Сборка и тесты в CODESYS выполняются на Windows (tools/codesys/cds.py, docs/MANUAL_STEPS.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Обязательный статанализ — тем же iec_checker v0.4, что и локально (docs/STATIC_ANALYSIS.md):
  # обоснования в tools/check/iec_checker_allow.toml подобраны под находки этой версии.
  IEC_CHECKER_VERSION: v0.4
  # Файл iec_checker_Linux_x86_64 релиза v0.4: размер — из API GitHub Releases (поле size).
  # Контрольной суммы у релиза 2022 года нет: SHA-256 вычислен по скачанному файлу 2026-10-16
  # (доверие при первом использовании). Пустое значение — шаг загрузки только предупреждает.
  IEC_CHECKER_SIZE: "10816408"
  IEC_CHECKER_SHA256: e7bea2a594ad47d089650944c9095251a7db5b44c953f726390ca0023675fa40
  # Необязательная сверка с новой версией разборщика: образ nightly, закреплённый по дайджесту
  # (Docker Hub, тег nightly от 2026-07-13). Обновлять дайджест — осознанно, вместе с обоснованиями.
  IEC_CHECKER_IMAGE: jubnzv1/iec-checker:nightly@sha256:fb1b148d4b6c5899f04924e87f78c6b5a3fc54ced31496b9ad50d0c8fbbdbe3d
  RUSTY_VERSION: v1.0.6
  # SHA-256 файлов релиза RuSTy v1.0.6 (из API GitHub Releases, поле digest)
  RUSTY_PLC_SHA256: cee05d9871b7a4dea66ad0e1a3a94cce858d28967c0bdecd16a821e3c621a6bf
  RUSTY_STDLIB_SHA256: 17086c67d46cdba0a6acf8c3c8e3b594804053df3913dab2756ef555cb826129

jobs:
  checks:
    name: Python, сборка ST, линтер, iec_checker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Зависимости
        run: python -m pip install -r requirements-dev.txt

      # До pytest: с переменной IEC_CHECKER интеграционные тесты идут с настоящим разборщиком,
      # в том числе проверка, что tools/check/iec_checker_allow.toml соответствует src/ и tests/.
      - name: Загрузка iec_checker ${{ env.IEC_CHECKER_VERSION }}
        run: |
          dir="$RUNNER_TEMP/iec-checker"
          url="https://github.com/iec-checker/iec-checker/releases/download/$IEC_CHECKER_VERSION/iec_checker_Linux_x86_64"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/iec_checker" "$url"
          size=$(stat -c %s "$dir/iec_checker")
          if [ "$size" != "$IEC_CHECKER_SIZE" ]; then
            echo "::error::iec_checker: размер файла $size, ожидался $IEC_CHECKER_SIZE"
            exit 1
          fi
          sum=$(sha256sum "$dir/iec_checker" | cut -d ' ' -f 1)
          if [ -n "$IEC_CHECKER_SHA256" ]; then
            echo "$IEC_CHECKER_SHA256  $dir/iec_checker" | sha256sum -c -
          else
            echo "::warning::SHA-256 iec_checker $IEC_CHECKER_VERSION не закреплён: $sum — впишите его в IEC_CHECKER_SHA256 (ci.yml)"
          fi
          chmod +x "$dir/iec_checker"
          echo "IEC_CHECKER=$dir/iec_checker" >> "$GITHUB_ENV"

      # Проверки ниже запускаются все, даже если одна упала: сводка показывает полную картину,
      # а задание всё равно завершается ошибкой.
      - name: ruff check
        id: ruff
        if: ${{ !cancelled() }}
        run: python -m ruff check .

      - name: ruff format --check
        id: ruff_format
        if: ${{ !cancelled() }}
        run: python -m ruff format --check .

      - name: mypy
        id: mypy
        if: ${{ !cancelled() }}
        run: python -m mypy

      - name: pytest
        id: pytest
        if: ${{ !cancelled() }}
        run: python -m pytest

      - name: Сборка ST (assemble)
        id: assemble
        if: ${{ !cancelled() }}
        run: python tools/assemble.py --tests

      - name: Линтер ST (st_lint)
        id: st_lint
        if: ${{ !cancelled() }}
        run: python tools/check/st_lint.py --strict

      # run_iec_checker.py сам собирает вариант iec-checker в build/assembled/iec-checker/ и берёт
      # бинарник из переменной IEC_CHECKER; обоснованные находки — tools/check/iec_checker_allow.toml
      # и docs/STATIC_ANALYSIS.md
      - name: Статанализ (iec_checker)
        id: iec_checker
        if: ${{ !cancelled() }}
        run: python tools/check/run_iec_checker.py --tests

      - name: Сводка
        if: ${{ !cancelled() }}
        env:
          R_RUFF: ${{ steps.ruff.outcome }}
          R_RUFF_FORMAT: ${{ steps.ruff_format.outcome }}
          R_MYPY: ${{ steps.mypy.outcome }}
          R_PYTEST: ${{ steps.pytest.outcome }}
          R_ASSEMBLE: ${{ steps.assemble.outcome }}
          R_ST_LINT: ${{ steps.st_lint.outcome }}
          R_IEC_CHECKER: ${{ steps.iec_checker.outcome }}
        run: |
          status() {
            case "$1" in
              success) echo "пройдено" ;;
              failure) echo "**ошибка**" ;;
              skipped) echo "пропущено" ;;
              *) echo "${1:-нет данных}" ;;
            esac
          }
          {
            echo "## Проверки без CODESYS"
            echo ""
            echo "| Проверка | Итог |"
            echo "|---|---|"
            echo "| ruff check | $(status "$R_RUFF") |"
            echo "| ruff format --check | $(status "$R_RUFF_FORMAT") |"
            echo "| mypy | $(status "$R_MYPY") |"
            echo "| pytest | $(status "$R_PYTEST") |"
            echo "| assemble | $(status "$R_ASSEMBLE") |"
            echo "| st_lint --strict | $(status "$R_ST_LINT") |"
            echo "| iec_checker $IEC_CHECKER_VERSION | $(status "$R_IEC_CHECKER") |"
            echo ""
            echo "Отчёты — в артефакте \`build-reports\`. Находки iec_checker разбираются в \`docs/STATIC_ANALYSIS.md\`."
            # Без раздела обоснованных находок: он может превысить предел сводки GitHub (1024k), и тогда
            # GitHub отбрасывает сводку шага целиком; полный отчёт — в артефакте
            if [ -f build/iec_checker.md ]; then
              echo ""
              awk '/^## /{skip = /^## Обоснованные находки/} !skip' build/iec_checker.md
              echo ""
              echo "Список обоснованных находок — в \`iec_checker.md\` артефакта \`build-reports\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Артефакты (build/)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/
          if-no-files-found: warn
          retention-days: 14

  packages:
    name: Эмулятор и отчёт — mypy, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            docker/emulator-constraints.txt

      # Версии asyncua, paho-mqtt и cryptography — те же, что в образе эмулятора
      - name: Зависимости
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --constraint docker/emulator-constraints.txt -e "emulator[dev]" -e "report[dev]"

      # Образ эмулятора собирается с теми же версиями: все зависимости (и транзитивные) закреплены
      - name: Закреплённые зависимости образа эмулятора
        run: python -m pytest tests_stack/test_compose.py -k emulator_constraints -ra

      - name: mypy — эмулятор
        id: mypy_emulator
        if: ${{ !cancelled() }}
        working-directory: emulator
        run: python -m mypy

      - name: pytest — эмулятор (модель, шлюз команд, OPC UA и MQTT на 127.0.0.1, сообщения по схеме)
        id: pytest_emulator
        if: ${{ !cancelled() }}
        working-directory: emulator
        run: python -m pytest

      - name: mypy — отчёт
        id: mypy_report
        if: ${{ !cancelled() }}
        working-directory: report
        run: python -m mypy

      - name: pytest — отчёт
        id: pytest_report
        if: ${{ !cancelled() }}
        working-directory: report
        run: python -m pytest

  stack:
    # Стенд с нуля, как у пользователя: make env → make demo. Порт InfluxDB публикуется на 127.0.0.1
    # (DEV=1): по нему идут запросы интеграционных тестов и отчёта.
    name: Стенд docker compose — make demo, интеграционные тесты
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            docker/emulator-constraints.txt

      - name: Зависимости
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --constraint docker/emulator-constraints.txt -e report

      - name: .env со случайными паролями
        run: make env PYTHON=python

      - name: Проверка compose (все файлы и профили)
        run: |
          docker compose -f docker-compose.yml --profile demo --profile nodered config --quiet
          docker compose -f docker-compose.yml -f docker-compose.tls.yml -f docker-compose.dev.yml config --quiet

      # stack_wait.py ждёт здоровья сервисов, телеметрии в InfluxDB, рождения PLC1 и трёх дашбордов
      # в Grafana не дольше 300 с (критерий «make demo за 5 минут»); сборка образа эмулятора — до него
      - name: make demo DEV=1
        id: demo
        run: |
          start=$(date +%s)
          make demo DEV=1 PYTHON=python
          seconds=$(( $(date +%s) - start ))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          # Критерий готовности — 5 минут с нуля, включая загрузку образов и сборку эмулятора.
          # Превышение — предупреждение, а не ошибка: время загрузки образов зависит от сети раннера.
          if [ "$seconds" -gt 300 ]; then
            echo "::warning::make demo с нуля заняла ${seconds} с — больше 5 минут"
          fi

      # tests_stack/test_stack_integration.py (IIOT_STACK=1: неподнятый стенд — ошибка) и
      # tools_project/check_dashboards.py: каждая панель трёх дашбордов возвращает данные
      - name: Интеграционные тесты и панели дашбордов
        id: test_stack
        run: make test-stack DEV=1 PYTHON=python

      - name: Суточный отчёт по данным стенда
        id: report
        working-directory: report
        run: |
          set -a; . ../.env; set +a
          KNS_REPORT_INFLUX_URL=http://127.0.0.1:8086 python -m pytest -m integration -ra

      - name: Сводка
        if: ${{ !cancelled() }}
        env:
          DEMO_SECONDS: ${{ steps.demo.outputs.seconds }}
          R_DEMO: ${{ steps.demo.outcome }}
          R_TEST_STACK: ${{ steps.test_stack.outcome }}
          R_REPORT: ${{ steps.report.outcome }}
        run: |
          {
            echo "## Стенд docker compose"
            echo ""
            echo "| Шаг | Итог |"
            echo "|---|---|"
            echo "| make demo DEV=1 (с нуля, включая сборку образа эмулятора) | ${R_DEMO:-нет данных}, ${DEMO_SECONDS:-?} с |"
            echo "| интеграционные тесты и панели дашбордов | ${R_TEST_STACK:-нет данных} |"
            echo "| суточный отчёт по данным InfluxDB | ${R_REPORT:-нет данных} |"
            if [ -f build/dashboards_check.md ]; then
              echo ""
              cat build/dashboards_check.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Журналы сервисов
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile demo logs --no-color --tail 300

      - name: Артефакты (build/)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: stack-reports
          path: build/
          if-no-files-found: warn
          retention-days: 14

      - name: Остановка
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile demo --profile nodered down --volumes

  iec_checker_nightly:
    # Необязательная сверка: новая версия разборщика может найти больше или иначе. Расхождения
    # с v0.4 переносятся в docs/STATIC_ANALYSIS.md (столбец «решение»), падение не блокирует слияние.
    name: iec_checker nightly, Docker (необязательно)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Загрузка образа
        run: docker pull "$IEC_CHECKER_IMAGE"

      - name: Статанализ (iec_checker nightly)
        id: nightly
        run: python tools/check/run_iec_checker.py --docker "$IEC_CHECKER_IMAGE" --tests

      - name: Сводка
        if: ${{ !cancelled() }}
        env:
          R_NIGHTLY: ${{ steps.nightly.outcome }}
        run: |
          {
            echo "## iec_checker nightly (необязательная проверка)"
            echo ""
            echo "Образ: \`$IEC_CHECKER_IMAGE\`. Итог: ${R_NIGHTLY:-нет данных}."
            echo ""
            # Без раздела обоснованных находок: он может превысить предел сводки GitHub (1024k), и тогда
            # GitHub отбрасывает сводку шага целиком; полный отчёт — в артефакте
            if [ -f build/iec_checker.md ]; then
              awk '/^## /{skip = /^## Обоснованные находки/} !skip' build/iec_checker.md
              echo ""
              echo "Список обоснованных находок — в \`iec_checker.md\` артефакта \`iec-checker-nightly-reports\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Артефакты (build/)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: iec-checker-nightly-reports
          path: build/
          if-no-files-found: warn
          retention-days: 14

  rusty:
    # Необязательная проверка: RuSTy понимает не все расширения CODESYS,
    # несовместимые файлы перечислены в tools/check/rusty_exclude.txt.
    name: RuSTy plc --check (необязательно)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Загрузка RuSTy ${{ env.RUSTY_VERSION }}
        run: |
          dir="$RUNNER_TEMP/rusty"
          base="https://github.com/PLC-lang/rusty/releases/download/$RUSTY_VERSION"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/plc" "$base/plc-linux-x86_64"
          curl -fsSL --retry 3 -o "$dir/stdlib.tar.gz" "$base/stdlib-${RUSTY_VERSION#v}.tar.gz"
          echo "$RUSTY_PLC_SHA256  $dir/plc" | sha256sum -c -
          echo "$RUSTY_STDLIB_SHA256  $dir/stdlib.tar.gz" | sha256sum -c -
          chmod +x "$dir/plc"
          tar -xzf "$dir/stdlib.tar.gz" -C "$dir"
          "$dir/plc" --version
          echo "RUSTY_PLC=$dir/plc" >> "$GITHUB_ENV"
          echo "RUSTY_STDLIB_INCLUDE=$dir/stdlib/include" >> "$GITHUB_ENV"

      # run_rusty.py сам собирает вариант rusty (src/ и tests/ с прокладками tools/check/rusty_shims/);
      # компилятор и stdlib — из переменных RUSTY_PLC и RUSTY_STDLIB_INCLUDE
      - name: RuSTy plc --check
        id: rusty
        run: python tools/check/run_rusty.py

      - name: Сводка
        if: ${{ !cancelled() }}
        env:
          R_RUSTY: ${{ steps.rusty.outcome }}
        run: |
          {
            echo "## RuSTy $RUSTY_VERSION (необязательная проверка)"
            echo ""
            echo "Итог \`plc --check\`: ${R_RUSTY:-нет данных}"
            echo ""
            if [ -f build/rusty.log ]; then
              echo '```text'
              tail -n 50 build/rusty.log
              echo '```'
            fi
            echo ""
            echo "Падение этого задания не блокирует слияние. Исключения — в \`tools/check/rusty_exclude.txt\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Артефакты (build/)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rusty-reports
          path: build/
          if-no-files-found: warn
          retention-days: 14
