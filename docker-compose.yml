# IIoT-стенд КНС-1 «от датчика до дашборда»: Mosquitto → Telegraf → InfluxDB 2 → Grafana.
# Описание — docs/ARCHITECTURE.md, схема данных — docs/data_schema.md.
#
#   make up      брокер, БД, сбор и дашборды (данные — от ПЛК: CODESYS Control Win или ПЛК210)
#   make demo    то же и эмулятор ПЛК (профиль demo), ожидание данных на дашбордах
#   make down    остановить (тома сохраняются; make clean — удалить и тома)
#
# Секреты — только в .env (создаёт make env из .env.example). Образы закреплены по версии.
# Наружу (на хост) публикуются только Grafana и MQTT, по умолчанию на 127.0.0.1.

name: plc-iiot-stack

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service: &service
  restart: unless-stopped
  security_opt:
    - "no-new-privileges:true"
  logging: *logging
  networks:
    - iiot

services:
  # --- Брокер MQTT -------------------------------------------------------------------------------
  mosquitto:
    <<: *service
    image: eclipse-mosquitto:2.0.22
    entrypoint: ["/bin/sh", "/mosquitto/scripts/docker-entrypoint.sh"]
    environment:
      MQTT_TOPIC_ROOT: ${MQTT_TOPIC_ROOT:-vodokanal}
      MQTT_TLS: "false"
      MQTT_PLC_USER: ${MQTT_PLC_USER:-plc}
      MQTT_PLC_PASSWORD: ${MQTT_PLC_PASSWORD:?MQTT_PLC_PASSWORD не задан (make env)}
      MQTT_TELEGRAF_USER: ${MQTT_TELEGRAF_USER:-telegraf}
      MQTT_TELEGRAF_PASSWORD: ${MQTT_TELEGRAF_PASSWORD:?MQTT_TELEGRAF_PASSWORD не задан (make env)}
      MQTT_OPERATOR_USER: ${MQTT_OPERATOR_USER:-operator}
      MQTT_OPERATOR_PASSWORD: ${MQTT_OPERATOR_PASSWORD:?MQTT_OPERATOR_PASSWORD не задан (make env)}
      MQTT_MONITOR_USER: ${MQTT_MONITOR_USER:-monitor}
      MQTT_MONITOR_PASSWORD: ${MQTT_MONITOR_PASSWORD:?MQTT_MONITOR_PASSWORD не задан (make env)}
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/docker-entrypoint.sh:/mosquitto/scripts/docker-entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    ports:
      # ПЛК на этом же компьютере (CODESYS Control Win) подключается к 127.0.0.1:1883;
      # ПЛК в сети — к TLS-слушателю 8883 (docker-compose.tls.yml)
      - "${MQTT_BIND:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
    healthcheck:
      # Вход по паролю и чтение $SYS (сохранённое сообщение, обновляется раз в sys_interval = 10 с)
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h 127.0.0.1 -p 1883 -u "$$MQTT_MONITOR_USER" -P "$$MQTT_MONITOR_PASSWORD"
          -t '$$SYS/broker/uptime' -C 1 -W 12 >/dev/null
      interval: 15s
      timeout: 15s
      retries: 6
      start_period: 10s

  # --- База временных рядов ----------------------------------------------------------------------
  influxdb:
    <<: *service
    image: influxdb:2.9.1-alpine
    environment:
      # Первичная установка выполняется один раз, при пустом томе influxdb-data
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?INFLUX_ADMIN_PASSWORD не задан (make env)}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-vodokanal}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-kns_raw}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION:-30d}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN:?INFLUX_ADMIN_TOKEN не задан (make env)}
      INFLUXD_REPORTING_DISABLED: "true"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Однократная настройка InfluxDB: бакет агрегатов, задача прореживания, токены с минимальными
  # правами для Telegraf и Grafana (influxdb/influxdb-init.sh). Повторный запуск безопасен.
  influxdb-init:
    image: influxdb:2.9.1-alpine
    entrypoint: ["/bin/bash", "/init/influxdb-init.sh"]
    restart: "no"
    security_opt:
      - "no-new-privileges:true"
    logging: *logging
    networks:
      - iiot
    environment:
      INFLUX_HOST: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_ADMIN_TOKEN:?INFLUX_ADMIN_TOKEN не задан (make env)}
      INFLUX_ORG: ${INFLUX_ORG:-vodokanal}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-kns_raw}
      INFLUX_BUCKET_AGG: ${INFLUX_BUCKET_AGG:-kns_agg}
      INFLUX_RETENTION: ${INFLUX_RETENTION:-30d}
      INFLUX_RETENTION_AGG: ${INFLUX_RETENTION_AGG:-730d}
      GRAFANA_UID: "472"
    volumes:
      - ./influxdb:/init:ro
      - influx-tokens:/tokens
    depends_on:
      influxdb:
        condition: service_healthy

  # --- Сбор: MQTT и OPC UA → InfluxDB ------------------------------------------------------------
  telegraf:
    <<: *service
    image: telegraf:1.39.3-alpine
    entrypoint: ["/bin/sh", "/etc/telegraf/scripts/docker-entrypoint.sh"]
    environment:
      MQTT_URL: tcp://mosquitto:1883
      MQTT_TOPIC_ROOT: ${MQTT_TOPIC_ROOT:-vodokanal}
      MQTT_TELEGRAF_USER: ${MQTT_TELEGRAF_USER:-telegraf}
      MQTT_TELEGRAF_PASSWORD: ${MQTT_TELEGRAF_PASSWORD:?MQTT_TELEGRAF_PASSWORD не задан (make env)}
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUX_ORG:-vodokanal}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-kns_raw}
      INFLUX_TOKEN_FILE: /run/influx-tokens/telegraf.token
      OPCUA_ENABLED: ${OPCUA_ENABLED:-true}
      OPCUA_ENDPOINT: ${OPCUA_ENDPOINT:-opc.tcp://emulator:4840}
      OPCUA_NAMESPACE: ${OPCUA_NAMESPACE:-4}
      OPCUA_ID_PREFIX: "${OPCUA_ID_PREFIX:-|var|CODESYS Control Win V3.}"
      OPCUA_SECURITY_POLICY: ${OPCUA_SECURITY_POLICY:-None}
      OPCUA_SECURITY_MODE: ${OPCUA_SECURITY_MODE:-None}
      # Сертификат клиента OPC UA: пусто — при политике не None entrypoint берёт том telegraf-pki
      OPCUA_CERTIFICATE: ${OPCUA_CERTIFICATE:-}
      OPCUA_PRIVATE_KEY: ${OPCUA_PRIVATE_KEY:-}
      OPCUA_AUTH_METHOD: ${OPCUA_AUTH_METHOD:-Anonymous}
      OPCUA_USERNAME: ${OPCUA_USERNAME:-}
      OPCUA_PASSWORD: ${OPCUA_PASSWORD:-}
      OPCUA_INTERVAL: ${OPCUA_INTERVAL:-10s}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./telegraf/telegraf.d:/etc/telegraf/telegraf.d:ro
      - ./telegraf/lookup:/etc/telegraf/lookup:ro
      - ./telegraf/docker-entrypoint.sh:/etc/telegraf/scripts/docker-entrypoint.sh:ro
      - influx-tokens:/run/influx-tokens:ro
      # Сертификат и ключ клиента OPC UA переживают пересоздание контейнера (доверие сервера — один раз)
      - telegraf-pki:/var/lib/telegraf/pki
    extra_hosts:
      # OPC UA-сервер CODESYS Control Win на хосте: OPCUA_ENDPOINT=opc.tcp://host.docker.internal:4840
      - "host.docker.internal:host-gateway"
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      influxdb-init:
        condition: service_completed_successfully
    healthcheck:
      # outputs.health: 503, если буфер вывода в InfluxDB заполнен больше чем наполовину
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Дашборды ----------------------------------------------------------------------------------
  grafana:
    <<: *service
    image: grafana/grafana:12.4.12
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD не задан (make env)}
      # Ключ шифрования секретов в grafana.db (токен источника данных): без него Grafana берёт ключ по
      # умолчанию, одинаковый во всех установках
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?GRAFANA_SECRET_KEY не задан (make env)}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Стенд не ходит в интернет за плагинами (сеть АСУ ТП обычно изолирована)
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/kns1-overview.json
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      # Подставляются в provisioning/datasources/influxdb.yml
      INFLUX_ORG: ${INFLUX_ORG:-vodokanal}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-kns_raw}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
      - influx-tokens:/run/influx-tokens:ro
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      influxdb:
        condition: service_healthy
      influxdb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # --- Эмулятор ПЛК (профиль demo): OPC UA-сервер с тегами флагмана и публикатор MQTT --------------
  emulator:
    <<: *service
    profiles: ["demo"]
    build:
      context: .
      dockerfile: docker/emulator.Dockerfile
    image: plc-iiot-stack/emulator:local
    environment:
      EMU_MQTT_HOST: mosquitto
      EMU_MQTT_PORT: "1883"
      EMU_MQTT_USER: ${MQTT_PLC_USER:-plc}
      EMU_MQTT_PASSWORD: ${MQTT_PLC_PASSWORD:?MQTT_PLC_PASSWORD не задан (make env)}
      EMU_OPCUA_ENDPOINT: opc.tcp://0.0.0.0:4840
      EMU_OPCUA_HOSTNAME: emulator
      # Анонимный клиент OPC UA эмулятора — только чтение (так читает Telegraf в демо)
      EMU_OPCUA_ALLOW_ANONYMOUS: ${EMU_OPCUA_ALLOW_ANONYMOUS:-true}
      EMU_OPCUA_USER: ${OPCUA_USERNAME:-}
      EMU_OPCUA_PASSWORD: ${OPCUA_PASSWORD:-}
      EMU_TIME_FACTOR: ${EMU_TIME_FACTOR:-60}
      EMU_LOG_LEVEL: ${EMU_LOG_LEVEL:-INFO}
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 4840), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # --- Node-RED (профиль nodered, по желанию): пустой редактор для панели команд --------------------
  # Готового потока в репозитории нет: узел mqtt out с учётной записью оператора собирается вручную;
  # белый список и диапазоны проверяет ПЛК (эмулятор), а не Node-RED.
  nodered:
    <<: *service
    profiles: ["nodered"]
    image: nodered/node-red:4.1.15-22
    environment:
      TZ: ${TZ:-Europe/Moscow}
      # Ключ шифрования учётных данных узлов (flows_cred.json в томе nodered-data)
      NODE_RED_CREDENTIAL_SECRET: ${NODERED_CREDENTIAL_SECRET:?NODERED_CREDENTIAL_SECRET не задан (make env)}
    volumes:
      - nodered-data:/data
    ports:
      # Редактор Node-RED без входа по паролю: только локально
      - "127.0.0.1:${NODERED_PORT:-1880}:1880"
    depends_on:
      mosquitto:
        condition: service_healthy

networks:
  iiot:
    name: plc-iiot-stack
    driver: bridge

volumes:
  mosquitto-data:
  influxdb-data:
  influxdb-config:
  influx-tokens:
  telegraf-pki:
  grafana-data:
  nodered-data:
