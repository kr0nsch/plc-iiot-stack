# Telegraf стенда КНС-1: MQTT (и OPC UA из telegraf.d/opcua.conf) → InfluxDB 2.
# Модель хранения (measurement, теги, поля) — docs/data_schema.md, раздел 7. Любое изменение здесь
# сверяется с этим разделом: тест tests_stack/test_telegraf.py проверяет согласованность.
#
# Проверка конфигурации на работающем стенде — `telegraf --test --input-filter internal`: без входов
# MQTT. Полный `telegraf --test` подключится к брокеру с теми же client_id и постоянными сессиями, что у
# рабочего Telegraf: брокер отключит рабочий экземпляр (перехват сессии по MQTT), а сообщения сессии за
# это время получит и подтвердит пробный — в базу они не попадут.
#
# Значения ${...} подставляет Telegraf из окружения контейнера (docker-compose.yml, .env).
# Токен InfluxDB (только запись в бакет сырых данных) создаёт сервис influxdb-init; скрипт
# telegraf/docker-entrypoint.sh читает его из файла в INFLUX_TOKEN перед запуском.

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 20000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "1s"
  ## Имя контейнера в тегах не нужно: точки различаются site/area/unit/device
  omit_hostname = true
  ## Агрегаторов нет; явное значение — новое умолчание Telegraf 1.40
  skip_processors_after_aggregators = true
  debug = false
  quiet = false

###############################################################################
# Входы MQTT. Пять подключений — по одному на класс сообщений (docs/data_schema.md,
# раздел 2): у каждого класса свой формат JSON и свой measurement.
# Сессии постоянные (QoS 1): пока Telegraf перезапускается, брокер копит сообщения.
# schema_version читается тегом только для фильтра tagpass: принимаются версии 1.x,
# сообщения другой мажорной версии отбрасываются; в базу тег не пишется.
###############################################################################

# --- Телеметрия: {site}/{area}/{unit}/{device}/{metric} → telemetry -----------------------------
[[inputs.mqtt_consumer]]
  alias = "mqtt_telemetry"
  servers = ["${MQTT_URL}"]
  topics = ["${MQTT_TOPIC_ROOT}/+/+/+/+"]
  qos = 1
  client_id = "telegraf-telemetry"
  persistent_session = true
  connection_timeout = "30s"
  max_undelivered_messages = 5000
  username = "${MQTT_TELEGRAF_USER}"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  topic_tag = ""
  data_format = "json_v2"
  startup_error_behavior = "retry"
  tagexclude = ["schema_version"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/+/+/+/+"
    tags = "site/area/unit/device/metric"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "telemetry"
    timestamp_path = "ts"
    timestamp_format = "unix_ms"
    timestamp_timezone = "UTC"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "schema_version"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "quality"
      type = "string"

  [inputs.mqtt_consumer.tags]
    source = "mqtt"

  [inputs.mqtt_consumer.tagpass]
    schema_version = ["1.*"]

# --- Тревоги: {site}/{area}/{unit}/{device}/alarm/{suffix} → alarm --------------------------------
[[inputs.mqtt_consumer]]
  alias = "mqtt_alarm"
  servers = ["${MQTT_URL}"]
  topics = ["${MQTT_TOPIC_ROOT}/+/+/+/alarm/+"]
  qos = 1
  client_id = "telegraf-alarm"
  persistent_session = true
  connection_timeout = "30s"
  username = "${MQTT_TELEGRAF_USER}"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  topic_tag = ""
  data_format = "json_v2"
  startup_error_behavior = "retry"
  tagexclude = ["schema_version"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/+/+/+/alarm/+"
    tags = "site/area/unit/device/_/suffix"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "alarm"
    timestamp_path = "ts"
    timestamp_format = "unix_ms"
    timestamp_timezone = "UTC"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "schema_version"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "code"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "priority"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "id"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "state"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "prev_state"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "reason"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "float"
      optional = true

  [inputs.mqtt_consumer.tagpass]
    schema_version = ["1.*"]

# --- Команды (журнал аудита): {site}/{area}/{unit}/{device}/cmd/{command} → command ---------------
[[inputs.mqtt_consumer]]
  alias = "mqtt_command"
  servers = ["${MQTT_URL}"]
  topics = ["${MQTT_TOPIC_ROOT}/+/+/+/cmd/+"]
  qos = 1
  client_id = "telegraf-command"
  persistent_session = true
  connection_timeout = "30s"
  username = "${MQTT_TELEGRAF_USER}"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  topic_tag = ""
  data_format = "json_v2"
  startup_error_behavior = "retry"
  tagexclude = ["schema_version"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/+/+/+/cmd/+"
    tags = "site/area/unit/device/_/command"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "command"
    timestamp_path = "ts"
    timestamp_format = "unix_ms"
    timestamp_timezone = "UTC"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "schema_version"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "cmd_id"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "origin"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "float"
      optional = true

  [inputs.mqtt_consumer.tagpass]
    schema_version = ["1.*"]

# --- Ответы на команды: {site}/{area}/{unit}/{device}/cmd_ack/{command} → command_ack -------------
[[inputs.mqtt_consumer]]
  alias = "mqtt_command_ack"
  servers = ["${MQTT_URL}"]
  topics = ["${MQTT_TOPIC_ROOT}/+/+/+/cmd_ack/+"]
  qos = 1
  client_id = "telegraf-command-ack"
  persistent_session = true
  connection_timeout = "30s"
  username = "${MQTT_TELEGRAF_USER}"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  topic_tag = ""
  data_format = "json_v2"
  startup_error_behavior = "retry"
  tagexclude = ["schema_version"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/+/+/+/cmd_ack/+"
    tags = "site/area/unit/device/_/command"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "command_ack"
    timestamp_path = "ts"
    timestamp_format = "unix_ms"
    timestamp_timezone = "UTC"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "schema_version"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "result"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "cmd_id"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "reason"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "cmd_result"
      type = "string"
      optional = true

  [inputs.mqtt_consumer.tagpass]
    schema_version = ["1.*"]

# --- Состояние узлов (рождение, LWT): {site}/{area}/{unit}/{node}/status/connection → node_status -
[[inputs.mqtt_consumer]]
  alias = "mqtt_node_status"
  servers = ["${MQTT_URL}"]
  topics = ["${MQTT_TOPIC_ROOT}/+/+/+/status/+"]
  qos = 1
  client_id = "telegraf-node-status"
  persistent_session = true
  connection_timeout = "30s"
  username = "${MQTT_TELEGRAF_USER}"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  topic_tag = ""
  data_format = "json_v2"
  startup_error_behavior = "retry"
  tagexclude = ["schema_version"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/+/+/+/status/+"
    tags = "site/area/unit/device/_/_"

  ## Время точки — время приёма, а не ts: у завещания (LWT) ts — время подключения (текст LWT
  ## передаётся брокеру заранее), и точка offline легла бы раньше рождения этого же подключения —
  ## последним состоянием узла навсегда осталось бы online (docs/data_schema.md, раздел 7.1)
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "node_status"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "schema_version"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "state"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "reason"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "source"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sw_version"
      type = "string"
      optional = true

  [inputs.mqtt_consumer.tagpass]
    schema_version = ["1.*"]

# --- Собственные метрики Telegraf: только для проверки здоровья (outputs.health) ------------------
[[inputs.internal]]
  collect_memstats = false

###############################################################################
# Обработка
###############################################################################

# OPC UA отдаёт BOOL, INT и REAL как есть, а поле value в telemetry должно быть float во всех
# рядах (InfluxDB не допускает разных типов одного поля): BOOL → 0/1, целые → float.
[[processors.converter]]
  order = 1
  namepass = ["telemetry"]
  [processors.converter.fields]
    float = ["value"]

# Код статуса OPC UA (поле Quality входа opcua) хранится отдельно от quality MQTT
[[processors.rename]]
  order = 2
  namepass = ["telemetry"]
  [[processors.rename.replace]]
    field = "Quality"
    dest = "opcua_status"

# Русский текст тревоги по коду (перечень iolistgen): в ПЛК строк на русском нет (API раздел 19).
# Каталог по умолчанию — том контейнера; локальный стенд без Docker (tools_project/local_stack.ps1)
# задаёт TELEGRAF_LOOKUP_DIR — каталог telegraf/lookup репозитория
[[processors.lookup]]
  order = 3
  namepass = ["alarm"]
  files = ["${TELEGRAF_LOOKUP_DIR:-/etc/telegraf/lookup}/alarm_texts.json"]
  format = "json"
  key = '{{.Tag "code"}}'

###############################################################################
# Выходы
###############################################################################

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  timeout = "10s"
  namedrop = ["internal*"]

# HTTP-проверка здоровья для docker compose: 503, если буфер вывода в InfluxDB заполнен больше
# чем наполовину (InfluxDB недоступна или не успевает). Локальный стенд без Docker слушает
# только 127.0.0.1 (TELEGRAF_HEALTH_ADDRESS)
[[outputs.health]]
  service_address = "${TELEGRAF_HEALTH_ADDRESS:-http://:8080}"
  namepass = ["internal_write"]
  tagpass = { output = ["influxdb_v2"] }

  [[outputs.health.compares]]
    field = "buffer_size"
    lt = 10000.0
